<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Ripple</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #111418; --muted: #4a5360; --line: #d9dee5;
    --alert: #b3261e; --ack: #1d5fbf; --btn: #1d5fbf; --btn-text: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #1a1f26; --text: #f2f4f7; --muted: #aab3bf; --line: #2c333d;
      --alert: #ff6b5f; --ack: #6aa2ff; --btn: #6aa2ff; --btn-text: #0f1216; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 19px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  .status { font-weight: 700; color: var(--ack); }
  button { display: block; width: 100%; min-height: 64px; margin: 20px 0 6px; border-radius: 16px; border: 0;
    background: var(--btn); color: var(--btn-text); font: 700 21px/1.2 inherit; font-family: inherit; cursor: pointer; padding: 16px; }
  button:disabled { opacity: .55; cursor: default; }
  .error { color: var(--alert); font-weight: 600; }
  .note { font-size: 15px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p>Loading…</p></main>
<script>
(function () {
  "use strict";
  var token = location.pathname.split("/").filter(Boolean).pop() || "";
  var api = "/v1/ack/" + encodeURIComponent(token);
  var app = document.getElementById("app");
  var busy = false, ended = false, error = "", view = null;

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "onclick") node.addEventListener("click", attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) { if (arguments[i]) node.appendChild(arguments[i]); }
    return node;
  }
  function time(iso) { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  function render() {
    if (ended || !view) return;
    var v = view;
    var card = el("div", { class: "card" },
      el("h1", { text: "Ripple alert for " + v.wearerName }),
      el("p", { class: "muted", text: "Alert at " + time(v.alertTime) })
    );
    if (v.youAcknowledged) {
      card.appendChild(el("p", { class: "status", role: "status", text: "Thanks. Others alerted have been told you're checking on " + v.wearerName + "." }));
      card.appendChild(el("p", { class: "muted", text: "Please call or check on them." }));
    } else {
      if (v.acknowledged && v.responderName) {
        card.appendChild(el("p", { class: "status", text: v.responderName + " is already checking." }));
      }
      var button = el("button", { type: "button", onclick: acknowledge, text: busy ? "Sending…" : "I'm checking on " + v.wearerName });
      if (busy) button.setAttribute("disabled", "");
      card.appendChild(button);
    }
    if (error) card.appendChild(el("p", { class: "error", role: "alert", text: error }));
    card.appendChild(el("p", { class: "note", text: "Tapping means you're taking responsibility for checking on them. Ripple isn't an emergency service; if someone is in danger, call 911." }));
    app.replaceChildren(card);
  }

  function showClosed(message) {
    ended = true;
    app.replaceChildren(el("div", { class: "card" }, el("h1", { text: "This alert has closed" }), el("p", { class: "muted", text: message })));
  }

  function handle(response) {
    return response.json().catch(function () { return {}; }).then(function (body) {
      if (response.status === 410 || response.status === 404) { showClosed(body.message || "No action is needed."); return null; }
      if (!response.ok) throw new Error(body.message || ("Error " + response.status));
      return body;
    });
  }

  function load() {
    if (ended || busy) return;
    fetch(api, { cache: "no-store" }).then(handle).then(function (v) {
      if (v) { view = v; error = ""; render(); }
    }).catch(function (e) { error = "Can't reach Ripple: " + e.message; render(); });
  }

  function acknowledge() {
    if (busy) return;
    busy = true; error = ""; render();
    fetch(api, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(handle)
      .then(function (v) { busy = false; if (v) { view = v; render(); } })
      .catch(function (e) { busy = false; error = "Not recorded: " + e.message; render(); });
  }

  load();
  setInterval(load, 4000);
})();
</script>
</body>
</html>
