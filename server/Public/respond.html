<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>KAZE</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #111418; --muted: #4a5360; --line: #d9dee5;
    --safe: #1b7f3b; --awaiting: #8a6a00; --alert: #b3261e; --ack: #1d5fbf; --resolved: #5b6470;
    --btn: #111418; --btn-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #1a1f26; --text: #f2f4f7; --muted: #aab3bf; --line: #2c333d;
      --safe: #4cc471; --awaiting: #e8c547; --alert: #ff6b5f; --ack: #6aa2ff; --resolved: #9aa3ad;
      --btn: #f2f4f7; --btn-text: #0f1216; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 4px; }
  h2 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .status { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
  .alert .dot { background: var(--alert); } .alert { color: var(--alert); }
  .ack .dot { background: var(--ack); } .ack { color: var(--ack); }
  .resolved .dot { background: var(--resolved); } .resolved { color: var(--resolved); }
  .safe .dot { background: var(--safe); } .safe { color: var(--safe); }
  .demo { display: inline-block; background: var(--awaiting); color: #000; font-weight: 800; border-radius: 8px; padding: 2px 10px; font-size: 15px; letter-spacing: .06em; }
  .silent { border: 2px solid var(--alert); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  button, .button { display: block; width: 100%; min-height: 60px; margin: 10px 0; border-radius: 14px; border: 2px solid var(--btn);
    background: var(--btn); color: var(--btn-text); font: 700 20px/1.2 inherit; font-family: inherit; cursor: pointer; text-align: center; text-decoration: none; padding: 16px; }
  button.secondary { background: transparent; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  textarea { width: 100%; min-height: 84px; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chips button { width: auto; min-height: 44px; font-size: 16px; padding: 8px 14px; margin: 0; }
  ol.timeline { list-style: none; padding: 0; margin: 0; }
  ol.timeline li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  ol.timeline time { display: block; color: var(--muted); font-size: 15px; }
  .error { color: var(--alert); font-weight: 600; }
  .note { font-size: 15px; color: var(--muted); }
  .help-card { white-space: pre-wrap; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p>Loading alert…</p></main>
<script>
(function () {
  "use strict";
  var token = location.pathname.split("/").filter(Boolean).pop() || "";
  var api = "/v1/respond/" + encodeURIComponent(token);
  var app = document.getElementById("app");
  var ended = false, busy = false, lastError = "", showResolve = false, view = null;

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "onclick") node.addEventListener("click", attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) { if (arguments[i]) node.appendChild(arguments[i]); }
    return node;
  }
  function time(iso) { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }); }
  function key() {
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
  }

  function showEnded(message) {
    ended = true; view = null;
    app.replaceChildren(
      el("h1", { text: "Access ended" }),
      el("div", { class: "card" }, el("p", { text: message }),
        el("p", { class: "note", text: "Anything you already saw can't be recalled, but this page won't show anything more." }))
    );
  }

  function statusFor(v) {
    if (v.status === "resolved") return ["resolved", "Resolved"];
    if (v.progress === "assistanceArranged") return ["ack", (v.responderName || "A responder") + " is arranging help"];
    if (v.progress === "acknowledged") return ["ack", (v.responderName || "A responder") + " acknowledged"];
    return ["alert", "Alert open: needs a responder"];
  }

  function render() {
    var v = view; if (!v) return;
    var s = statusFor(v);
    var nodes = [];
    if (v.simulated) nodes.push(el("p", null, el("span", { class: "demo", text: "DEMO: SIMULATED EVENT" })));
    nodes.push(el("h1", { text: v.wearerName ? v.wearerName + " may need help" : "Someone may need help" }));
    nodes.push(el("div", { class: "status " + s[0], role: "status" }, el("span", { class: "dot", "aria-hidden": "true" }), el("span", { text: s[1] })));

    var details = el("dl");
    function row(label, value) { if (value) { details.appendChild(el("dt", { text: label })); details.appendChild(el("dd", { text: value })); } }
    row("Reason", v.reason);
    row("Alert time", time(v.openedAt));
    row("Venue", v.venue);
    row("Phone", v.wearerPhone);
    row("You are", v.recipientName + " (" + (v.recipientKind === "helper" ? "temporary helper" : "trusted contact") + ")");
    if (v.wearerSafetyReportAt) row("Wearer update", "Reported they're okay at " + time(v.wearerSafetyReportAt));
    if (v.status === "resolved") row("Outcome", v.resolutionNote || (v.resolution === "safetyPinCancel" ? "Cancelled with the wearer's safety PIN" : "Stopped"));
    nodes.push(el("div", { class: "card" + (v.silent ? " silent" : "") }, details));

    if (v.silent) nodes.push(el("div", { class: "card silent" },
      el("p", { text: "This is a silent alert. They may not be able to talk freely. Don't call or text them about this alert." })));

    if (v.location) {
      var loc = el("div", { class: "card" },
        el("p", { text: "Last known location at " + time(v.location.capturedAt) + " (within about " + Math.round(v.location.accuracyMeters) + " m)." }));
      var a = el("a", { class: "button", href: v.location.mapURL, target: "_blank", rel: "noreferrer noopener", text: "Open map" });
      loc.appendChild(a);
      nodes.push(loc);
    } else if (v.locationNote) {
      nodes.push(el("p", { class: "note", text: v.locationNote }));
    }

    if (v.helpCard) nodes.push(el("div", { class: "card" }, el("h2", { text: "Help card" }), el("p", { class: "help-card", text: v.helpCard })));

    if (v.canAct) {
      var actions = el("div", null, el("h2", { text: "Your response" }));
      if (v.stepState !== "acknowledged") {
        actions.appendChild(el("button", { type: "button", onclick: function () { act("acknowledge"); }, text: "Acknowledge: I'm on it" }));
        actions.appendChild(el("p", { class: "note", text: "Acknowledging tells others you're taking responsibility. It doesn't mean help has arrived." }));
      }
      actions.appendChild(el("button", { type: "button", onclick: function () { act("arranging"); }, text: "I'm arranging help" }));
      actions.appendChild(el("button", { type: "button", class: "secondary", onclick: function () { showResolve = true; render(); }, text: "Mark resolved…" }));
      if (v.stepState !== "acknowledged") {
        actions.appendChild(el("button", { type: "button", class: "secondary", onclick: function () { act("decline"); }, text: "Decline: I can't help" }));
      }
      if (showResolve) {
        var box = el("textarea", { id: "outcome", "aria-label": "Outcome", placeholder: "What happened? For example: Help arrived" });
        var chips = el("div", { class: "chips" });
        ["Help arrived", "They're safe", "Emergency services called", "False alarm"].forEach(function (t) {
          chips.appendChild(el("button", { type: "button", class: "secondary", onclick: function () { box.value = t; }, text: t }));
        });
        actions.appendChild(el("div", { class: "card" }, el("label", { for: "outcome", text: "Outcome (required)" }), box, chips,
          el("button", { type: "button", onclick: function () { act("resolved", box.value); }, text: "Confirm resolved" })));
      }
      nodes.push(actions);
    }
    if (busy) nodes.push(el("p", { class: "muted", text: "Sending…" }));
    if (lastError) nodes.push(el("p", { class: "error", role: "alert", text: lastError }));

    if (v.timeline && v.timeline.length) {
      var list = el("ol", { class: "timeline" });
      v.timeline.forEach(function (e) {
        list.appendChild(el("li", null, el("time", { text: time(e.at) + (e.simulated ? " · demo" : "") }), el("span", { text: e.text })));
      });
      nodes.push(el("h2", { text: "Timeline" }), list);
    }
    nodes.push(el("p", { class: "note", text: "KAZE is a hackathon prototype, not an emergency service. If someone is in danger, call 911." }));

    var focused = document.activeElement && document.activeElement.id === "outcome" ? document.getElementById("outcome").value : null;
    app.replaceChildren.apply(app, nodes);
    if (focused !== null) { var o = document.getElementById("outcome"); if (o) { o.value = focused; o.focus(); } }
  }

  function handle(response) {
    return response.json().catch(function () { return {}; }).then(function (body) {
      if (response.status === 410 || response.status === 404) { showEnded(body.message || "This alert link isn't valid any more."); return null; }
      if (!response.ok) { throw new Error(body.message || ("Error " + response.status)); }
      return body;
    });
  }

  function load() {
    if (ended || busy) return;
    if (document.activeElement && document.activeElement.id === "outcome") return;
    fetch(api, { cache: "no-store" }).then(handle).then(function (v) {
      if (v) { view = v; lastError = ""; render(); }
    }).catch(function (e) { lastError = "Can't reach KAZE: " + e.message; render(); });
  }

  function act(action, outcome) {
    if (busy) return;
    busy = true; lastError = ""; render();
    fetch(api + "/action", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", "Idempotency-Key": key() },
      body: JSON.stringify({ action: action, outcome: outcome || null })
    }).then(handle).then(function (v) {
      busy = false;
      if (v) { view = v; if (action === "resolved") showResolve = false; render(); }
    }).catch(function (e) { busy = false; lastError = "Not confirmed: " + e.message; render(); });
  }

  load();
  setInterval(load, 2000);
})();
</script>
</body>
</html>
